<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>This is London</title>
  <meta name="description" content="A data art installation — the pulse of London's underground lines, live.">
  <meta property="og:title" content="This is London">
  <meta property="og:description" content="Live data art. Five Underground lines as a circulatory system.">
  <script src="config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="mode-light">

  <!-- B5: Curtain raise — first-load moment -->
  <div id="curtain-raise">
    <div id="curtain-text">
      <div id="curtain-line1">THIS IS LONDON</div>
      <div id="curtain-line2">FIVE LINES · 200 STATIONS · 5 MILLION JOURNEYS TODAY</div>
    </div>
  </div>

  <!-- B1: Service status banner -->
  <div id="status-banner" class="hidden"></div>

  <!-- Gauge: left edge, vertical -->
  <div id="pressure-gauge">
    <div id="gauge-bar"></div>
    <div id="gauge-label">FLOW</div>
  </div>

  <!-- Atmosphere tint: full-viewport colour temperature overlay -->
  <div id="atmosphere-tint"></div>

  <!-- Main map container -->
  <div id="map-container">
    <div id="map"></div>
    <canvas id="art-layer"></canvas>
  </div>

  <!-- Mobile bottom control bar -->
  <div id="mobile-controls">
    <button class="mob-ctrl-btn" id="mob-mode-btn" aria-label="Cycle map mode">
      <span class="mob-ctrl-icon">🗺</span>
      <span id="mob-mode-label">LIGHT</span>
    </button>
    <button class="mob-ctrl-btn" id="mob-thermal-btn" aria-label="Toggle thermal">
      <span class="mob-ctrl-icon">🌡</span>
      <span>THERMAL</span>
    </button>
    <button class="mob-ctrl-btn" id="mob-lang-btn" aria-label="Language portrait">
      <span class="mob-ctrl-icon">💬</span>
      <span>LANG</span>
    </button>
    <button class="mob-ctrl-btn" id="mob-gent-btn" aria-label="Gentrification">
      <span class="mob-ctrl-icon">📈</span>
      <span>GENT</span>
    </button>
    <button class="mob-ctrl-btn" id="mob-stations-btn" aria-label="Toggle stations">
      <span class="mob-ctrl-icon">⬤</span>
      <span>STATIONS</span>
    </button>
    <button class="mob-ctrl-btn" id="mob-mute-btn" aria-label="Toggle sound">
      <span class="mob-ctrl-icon">♪</span>
      <span>SOUND</span>
    </button>
  </div>

  <!-- Station panel: slides in from right -->
  <div id="station-panel" class="hidden">
    <div class="panel-drag-handle"></div>
    <div id="panel-close">×</div>

    <div id="panel-header">
      <div id="panel-station-name"></div>
      <div id="panel-borough-name"></div>
      <div id="panel-header-actions">
        <button id="compare-toggle" aria-label="Compare with another station">COMPARE +</button>
        <button id="journey-btn" aria-label="Plan journey from this station">JOURNEY FROM HERE</button>
      </div>
    </div>

    <!-- Comparison section -->
    <div id="panel-compare-content" style="display:none"></div>

    <!-- Journey clear -->
    <button id="journey-clear" style="display:none">CLEAR ROUTE</button>

    <!-- Dot-matrix arrivals board -->
    <div id="panel-arrivals">FETCHING...</div>

    <!-- People section -->
    <div class="panel-section">
      <div class="section-label">PEOPLE</div>
      <div class="section-content" id="panel-people-content"></div>
    </div>

    <!-- Place section -->
    <div class="panel-section">
      <div class="section-label">PLACE</div>
      <div class="section-content" id="panel-place-content"></div>
    </div>

    <!-- Right now section -->
    <div class="panel-section">
      <div class="section-label">RIGHT NOW</div>
      <div class="section-content" id="panel-now-content"></div>
    </div>
  </div>

  <!-- Borough panel: slides in from left -->
  <div id="borough-panel" class="hidden">
    <div class="panel-drag-handle"></div>
    <div id="borough-panel-close">×</div>
    <div id="borough-panel-header">
      <div id="borough-panel-name"></div>
      <div id="borough-panel-sub">LONDON BOROUGH</div>
      <button id="borough-story-btn" style="display:none" aria-label="Enter borough story mode">STORY MODE →</button>
    </div>
    <div id="borough-panel-facts"></div>
    <div id="borough-panel-data"></div>
  </div>

  <!-- WILD-005: Invisible City panel -->
  <div id="secret-panel" class="hidden">
    <div class="panel-drag-handle"></div>
    <div id="secret-panel-close">×</div>
    <div id="secret-classification"></div>
    <div id="secret-name"></div>
    <div id="secret-subtitle"></div>
    <div id="secret-body"></div>
    <div id="secret-footer">◈ CLASSIFIED LONDON UNDERGROUND INTELLIGENCE ◈</div>
  </div>

  <!-- WILD-002: Commuter Genome panel -->
  <div id="genome-panel" class="hidden">
    <div class="panel-drag-handle"></div>
    <div id="genome-panel-close">×</div>
    <div id="genome-title"></div>
    <div id="genome-content"></div>
  </div>

  <!-- B15: Borough story mode exit -->
  <button id="story-exit" style="display:none" aria-label="Exit story mode">EXIT STORY MODE</button>

  <!-- Title overlay: top left, always visible -->
  <div id="title-overlay">
    <span id="title-text">THIS IS LONDON</span>
    <span id="subtitle-text">FIVE LINES — LIVE · <span id="build-id"></span></span>
    <div id="title-controls">
      <button id="mute-toggle" aria-label="Toggle sound">♪</button>
      <button id="mode-toggle" aria-label="Cycle map mode">LIGHT</button>
      <button id="thermal-toggle" aria-label="Toggle thermal mode">THERMAL</button>
      <button id="stations-toggle" aria-label="Toggle stations">STATIONS</button>
      <button id="lang-toggle" aria-label="Language portrait">LANG</button>
      <button id="gent-toggle" aria-label="Gentrification gradient">GENT</button>
    </div>
    <!-- Air quality indicator -->
    <div id="aq-indicator"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
